name: Build PyCharm 2026.2.3 + Python 3.14.7 package

# Builds Install.intunewin and attaches it to the run as an artifact.
# Runs when the package changes, or on demand from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - PyCharm-2026.2.3-Python-3.14.7/**
      - tools/intunewin.py
      - .github/workflows/build-pycharm-python.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install cryptography

      # Downloads both installers, fails if either SHA-256 doesn't match the pinned value,
      # builds the package and verifies it (MAC, decryption, digest, contents).
      - name: Build Install.intunewin
        run: python PyCharm-2026.2.3-Python-3.14.7/build.py

      - name: Summary
        run: |
          pkg=PyCharm-2026.2.3-Python-3.14.7/output/Install.intunewin
          {
            echo "### Install.intunewin"
            echo "- Size: $(stat -c %s "$pkg") bytes"
            echo "- SHA-256: \`$(sha256sum "$pkg" | cut -d' ' -f1)\`"
            echo "- Download the **Install.intunewin** artifact below. GitHub delivers it inside a .zip; extract it before uploading to Intune."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Install.intunewin
          path: PyCharm-2026.2.3-Python-3.14.7/output/Install.intunewin
          # The package is encrypted, so compressing it again gains nothing.
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
